<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırla | Takasla</title>
  <link rel="icon" type="image/png" href="/favicon-32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    body {
      background: #0B0F19;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      width: 100%;
      max-width: 440px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 160px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    .logo {
      width: 54px;
      height: 54px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 8px;
      letter-spacing: -0.4px;
    }
    p.subtitle {
      font-size: 13.5px;
      color: #94A3B8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 7px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      background: #1E293B;
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #FFFFFF;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: #10B981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: #10B981;
      color: #064E3B;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.1s, background-color 0.2s;
    }
    .btn:hover {
      background: #059669;
      color: #FFFFFF;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      display: none;
      text-align: left;
    }
    .message.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      display: block;
    }
    .message.success {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
      display: block;
      text-align: center;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      background: rgba(16, 185, 129, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #10B981;
      font-size: 28px;
    }
  </style>
</head>
<body>
  <div class="card" id="formCard">
    <img src="/logo-takasla.png" alt="Takasla" class="logo" onerror="this.src='/favicon-32.png'">
    <h1>Yeni Şifre Belirleyin</h1>
    <p class="subtitle">Takasla hesabınız için yeni bir şifre girin. Şifreniz en az 6 karakter olmalıdır.</p>

    <div id="statusMessage" class="message"></div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="input-group">
        <label for="newPassword">Yeni Şifre</label>
        <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
      </div>
      <div class="input-group">
        <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
      </div>
      <button type="submit" class="btn" id="submitBtn">Şifremi Güncelle</button>
    </form>
  </div>

  <div class="card" id="successCard" style="display: none;">
    <div class="success-icon">✓</div>
    <h1>Şifreniz Güncellendi!</h1>
    <p class="subtitle" style="margin-bottom: 24px;">Yeni şifreniz başarıyla kaydedildi. Artık Takasla mobil uygulamasında yeni şifrenizle oturum açabilirsiniz.</p>
    <a href="https://takaslapp.com" class="btn" style="display: block; text-decoration: none; line-height: 22px;">Uygulamaya Dön</a>
  </div>

  <script>
    const SUPABASE_URL = "https://supabase.takaslapp.com";
    const SUPABASE_ANON = "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc4ODM2MzAwMCwiZXhwIjo0OTQ0MDM2NjAwLCJyb2xlIjoiYW5vbiJ9.hUvf_6rITGdijl2NTia81kLIVR_yfYt8cbPO4WYsoyM";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    // Hash içindeki token ve oturumu yakala
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        console.log("Password recovery session established!");
      }
    });

    async function handleReset(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      const msg = document.getElementById('statusMessage');
      const btn = document.getElementById('submitBtn');

      if (p1 !== p2) {
        msg.className = "message error";
        msg.innerText = "Girdiğiniz şifreler birbiriyle eşleşmiyor.";
        return;
      }

      if (p1.length < 6) {
        msg.className = "message error";
        msg.innerText = "Şifreniz en az 6 karakter olmalıdır.";
        return;
      }

      btn.disabled = true;
      btn.innerText = "Güncelleniyor...";
      msg.style.display = "none";

      try {
        const { data, error } = await supabase.auth.updateUser({ password: p1 });
        if (error) {
          msg.className = "message error";
          msg.innerText = error.message || "Şifre güncellenirken bir hata oluştu. Bağlantı süresi dolmuş olabilir.";
          btn.disabled = false;
          btn.innerText = "Şifremi Güncelle";
        } else {
          document.getElementById('formCard').style.display = 'none';
          document.getElementById('successCard').style.display = 'block';
        }
      } catch (err) {
        msg.className = "message error";
        msg.innerText = "Sunucuya bağlanılamadı. Lütfen tekrar deneyin.";
        btn.disabled = false;
        btn.innerText = "Şifremi Güncelle";
      }
    }
  </script>
</body>
</html>
